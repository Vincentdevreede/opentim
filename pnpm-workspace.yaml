packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
overrides:
  # Dependabot: XSS through an unescaped </script in a serialized function, fixed in 7.1.3.
  serialize-javascript: ^7.1.3
  # Dependabot: TLS crashes, a ReDoS and a signature check in node-forge, fixed in 1.4.3. Nuxt's dev server pulls it in.
  node-forge: ^1.4.3
