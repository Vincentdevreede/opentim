# The lab: its pages are routed in the browser.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health check for Coolify: no files, no access log.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html { add_header Cache-Control "no-cache"; }

    # Built files have hashed names, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any path that isn't a file is a page of the lab.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
