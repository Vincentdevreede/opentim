# The website: pages prerendered by nuxt generate.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health check for Coolify: no files, no access log.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built files have hashed names, so they never change.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
