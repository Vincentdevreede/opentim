<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colours from @opentim/theme: surface, and muted for the hint -->
    <meta name="theme-color" content="#0d3a3f" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>OpenTIM</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d3a3f;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #hint {
        position: fixed;
        inset: auto 0 15%;
        margin: 0;
        text-align: center;
        font:
          600 16px/1.4 ui-sans-serif,
          system-ui,
          sans-serif;
        color: #b2d4d6;
        pointer-events: none;
        transition: opacity 0.4s;
      }
      #hint.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <p id="hint">Click anywhere to drop a ball</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
