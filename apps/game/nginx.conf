# The game: one page, installable as a PWA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Installed copies check these on every start, so a new version reaches them.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Built files have hashed names, so they never change.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # Other files at the root, like registerSW.js, keep their names between versions.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
